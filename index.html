<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw Pro</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    
    <!-- 引入 Google Fonts (Press Start 2P) 用於像素風 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* 避免 Google Sites iframe 滾動條問題 */
        body { margin: 0; padding: 0; overflow: hidden; }
        /* 強制隱藏 root 的滾動條，確保畫面固定 */
        #root { height: 100vh; width: 100vw; overflow: hidden; }

        /* --- 自定義動畫 Keyframes --- */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        
        /* 滾動條樣式 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); border-radius: 4px; }
        
        .bg-custom { background-size: cover; background-position: center; }

        /* 背景粒子動畫 */
        @keyframes gold-scatter {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotate(0deg); 
                opacity: 0; 
            }
            10% { 
                opacity: 1; 
                transform: translate(calc(var(--tx) * 0.1 - 50%), calc(var(--ty) * 0.1 - 50%)) scale(1) rotate(45deg); 
                filter: brightness(150%) drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            }
            100% { 
                transform: translate(calc(var(--tx) - 50%), calc(var(--ty) - 50%)) scale(0) rotate(180deg); 
                opacity: 0; 
            }
        }

        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .bg-aurora { background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fbc2eb, #e0c3fc); background-size: 400% 400%; animation: aurora 15s ease infinite; }
        
        /* 童趣樂園 (玩具漂浮) 動畫 */
        @keyframes toy-float-up {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-70vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        /* Modal 動畫 */
        @keyframes scale-in {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in { animation: scale-in 0.2s ease-out forwards; }

        @keyframes slide-in-right {
            0% { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out forwards; }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }

        /* 背景特效動畫 */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 玩具總動員背景 */
        .bg-toystory {
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 100%);
            background-size: cover;
        }

        @keyframes cloud-drift {
            from { transform: translateX(-150px); }
            to { transform: translateX(100vw); }
        }

        /* ----------------------------------------------------------- */
        /* --- 蓄力特效動畫定義區 (Charge Effects) --- */
        /* ----------------------------------------------------------- */

        /* 1. 預設：閃光脈衝 (Flash) */
        @keyframes charge-flash-core {
            0% { opacity: 0; transform: scale(0.5); filter: brightness(1); }
            50% { opacity: 1; transform: scale(var(--charge-scale, 1.2)); filter: brightness(1.5) drop-shadow(0 0 30px gold); }
            100% { opacity: 0; transform: scale(var(--charge-scale, 1.5)); filter: brightness(2); }
        }
        @keyframes charge-flash-particles-spin {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.4) rotate(180deg); opacity: 0; }
        }

        /* 2. 霓虹聚光 (Implode) */
        @keyframes charge-implode-anim {
            0% { 
                transform: scale(2.5); 
                opacity: 0; 
                border-width: 4px; 
            }
            30% { opacity: 1; }
            100% { 
                transform: scale(0); 
                opacity: 0; 
                border-width: 20px; 
            }
        }

        /* 3. 玩具總動員 (Toy Story) */
        @keyframes toy-badge-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        @keyframes toy-pop-out {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translate(calc(var(--tx) * 0.3), calc(var(--ty) * 0.3)) scale(1.2) rotate(72deg); }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(360deg); opacity: 0; }
        }
        
        @keyframes toy-rainbow-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes toy-rainbow-appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .toy-rainbow-wrapper {
            position: absolute;
            inset: -200px;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: toy-rainbow-appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 3s;
            pointer-events: none;
        }

        .toy-rainbow-rays {
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(
                from 0deg,
                #ef4444 0deg 15deg, #f97316 15deg 30deg, #facc15 30deg 45deg,
                #22c55e 45deg 60deg, #3b82f6 60deg 75deg, #a855f7 75deg 90deg, #ef4444 90deg 105deg
            );
            mask-image: radial-gradient(circle, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%);
            animation: toy-rainbow-spin 10s linear infinite;
            filter: brightness(1.2);
        }
        
        /* 4. 巴斯光年 (Buzz Lightyear) */
        @keyframes buzz-ring-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes buzz-wings-deploy {
            0% { width: 40px; opacity: 0; }
            60% { width: 320px; opacity: 1; }
            80% { width: 280px; }
            100% { width: 300px; }
        }
        @keyframes buzz-fly-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            10% { transform: translateY(20px) scale(0.95); }
            20% { transform: translateY(0) scale(1.1); }
            100% { transform: translateY(-150vh) scale(0.5); opacity: 0; }
        }
        @keyframes buzz-jet-flow {
            0% { height: 0; opacity: 0; }
            10% { height: 100px; opacity: 1; }
            100% { height: 600px; opacity: 0; }
        }
        @keyframes buzz-smoke-puff {
            0% { transform: scale(0.2); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; filter: blur(10px); }
        }
        @keyframes buzz-star-flash {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1) rotate(45deg); }
            100% { transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) * 1.5)) scale(0) rotate(90deg); opacity: 0; }
        }

        .effect-buzz {
            mix-blend-mode: normal !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(75, 0, 130, 0.2) 0%, transparent 60%); 
        }

        .buzz-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .buzz-flying-group {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: buzz-fly-up 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards 3s;
        }

        .buzz-jet-beam {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 0;
            background: linear-gradient(to bottom, #fff, #22d3ee, #e879f9, #facc15, transparent);
            z-index: 1;
            border-radius: 0 0 20px 20px;
            filter: blur(5px);
            animation: buzz-jet-flow 0.8s ease-out forwards 3s;
        }

        .buzz-ring-purple {
            position: absolute;
            inset: 15px;
            border: 8px solid #9333ea;
            border-top-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: buzz-ring-rotate 3s linear infinite;
            filter: drop-shadow(0 0 5px rgba(147, 51, 234, 0.8));
            z-index: 15;
        }
        
        .buzz-ring-green {
            position: absolute;
            inset: 40px;
            border: 8px solid #4ade80;
            border-left-color: transparent;
            border-right-color: transparent;
            border-radius: 50%;
            animation: buzz-ring-rotate 2s linear infinite reverse;
            filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.8));
            z-index: 15;
        }

        .buzz-core {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ffffff 40%, #d1d5db 100%);
            border: 5px solid #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .buzz-wings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 80px;
            width: 300px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            animation: buzz-wings-deploy 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .buzz-wing-left, .buzz-wing-right {
            width: 42%;
            height: 100%;
            background: linear-gradient(to bottom, #9333ea, #7e22ce);
            border: 3px solid #e5e7eb;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .buzz-wing-left { border-radius: 20px 0 0 20px; border-right: none; }
        .buzz-wing-right { border-radius: 0 20px 20px 0; border-left: none; }
        
        .buzz-wing-stripes {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            height: 25px;
            background: repeating-linear-gradient(90deg, #ef4444, #ef4444 15px, #ffffff 15px, #ffffff 30px);
        }

        .buzz-aftermath {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            pointer-events: none;
        }

        .buzz-smoke {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #a855f7 0%, #d8b4fe 40%, transparent 80%);
            opacity: 0;
            animation: buzz-smoke-puff 1.2s ease-out forwards 3.1s;
        }

        .buzz-star {
            position: absolute;
            color: #facc15;
            opacity: 0;
            animation: buzz-star-flash 1s ease-out forwards;
        }

        /* 特效通用定位容器 */
        .effect-charge-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            margin-top: -500px;
            margin-left: -500px;
            z-index: 100;
            pointer-events: none;
            mix-blend-mode: screen; 
        }

        .effect-flash {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 223, 0, 0.6) 30%, rgba(255, 140, 0, 0.2) 60%, transparent 70%);
            animation: charge-flash-core 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .effect-flash::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px dashed rgba(255, 255, 255, 0.5); transform: scale(0.9); animation: charge-flash-particles-spin 2s linear infinite;
        }
        .effect-flash::after {
            content: ''; position: absolute; inset: -10%; border-radius: 50%; background-image: radial-gradient(circle, #fff 2px, transparent 3px); background-size: 50px 50px; opacity: 0.6; animation: charge-flash-particles-spin 2s linear infinite reverse;
        }

        .effect-implode {
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .implode-ring {
            position: absolute;
            inset: 0;
            margin: auto;
            border-radius: 50%;
            border-style: solid;
            box-shadow: 0 0 30px currentColor, inset 0 0 20px currentColor;
            opacity: 0;
            animation: charge-implode-anim 1.2s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
            mix-blend-mode: screen;
        }

        .effect-toystory {
            mix-blend-mode: normal !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(135,206,235,0.3) 0%, transparent 60%);
        }
        .toy-badge-container {
            position: relative;
            width: 140px;
            height: 140px;
            background: #FACC15;
            border: 12px solid #3B82F6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.3);
            animation: toy-badge-bounce 0.6s ease-in-out infinite;
            z-index: 20;
        }
        .toy-badge-star {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        
        .toy-particle {
            position: absolute;
            font-size: 70px;
            z-index: 10;
            animation: toy-pop-out 1s ease-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* 隱形觸發區域 */
        .sidebar-trigger-zone {
            position: fixed; top: 0; left: 0; bottom: 0; width: 20px; z-index: 50;
        }
        .settings-trigger-zone {
            position: fixed; top: 0; right: 0; bottom: 0; width: 20px; z-index: 45;
        }

        /* --- 標題文字動畫 Keyframes --- */
        @keyframes text-shine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        .animate-text-shine {
            background-image: linear-gradient(to right, currentColor 20%, #fff 40%, #fff 60%, currentColor 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: text-shine 3s linear infinite;
        }

        @keyframes text-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-text-float { animation: text-float 3s ease-in-out infinite; }

        @keyframes text-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-text-pop { animation: text-pop 2s ease-in-out infinite; }

        /* --- 拋物線彩帶動畫 (Parabolic Confetti) --- */
        @keyframes confetti-flight-x {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--end-x)); }
        }
        @keyframes confetti-flight-y {
            0% { 
                transform: translateY(0); 
                opacity: 1;
                animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
            }
            50% { 
                transform: translateY(var(--apex-y)); 
                animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
            }
            85% { opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
        @keyframes confetti-spin-axis {
            0% { transform: rotate(0deg) rotateX(0deg); }
            100% { transform: rotate(var(--rot-z)) rotateX(var(--rot-x)); }
        }

        /* --- 老虎機 (Slot Machine) 動畫 --- */
        @keyframes slot-spin-blur {
            0% { transform: translateY(-30px); filter: blur(1px); }
            50% { transform: translateY(30px); filter: blur(4px); }
            100% { transform: translateY(-30px); filter: blur(1px); }
        }
        @keyframes slot-light-blink {
            0%, 100% { background-color: #facc15; box-shadow: 0 0 5px #facc15; transform: scale(1); }
            50% { background-color: #fff; box-shadow: 0 0 15px #fff; transform: scale(1.2); }
        }
        .slot-machine-frame {
            background: linear-gradient(180deg, #dc2626 0%, #b91c1c 40%, #7f1d1d 100%);
            border: 8px solid #f59e0b;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 20px 50px rgba(0,0,0,0.8), 0 0 0 10px #b45309;
            border-radius: 30px;
            position: relative;
        }

        .slot-window {
            background: #f8fafc;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            border: 6px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .slot-window::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .slot-light {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #facc15;
            border: 2px solid #b45309;
            z-index: 10;
        }
        .animate-slot-spin {
            animation: slot-spin-blur 0.1s linear infinite;
        }
        
        /* 科技解碼 (Decode) 抽獎動畫 */
        @keyframes scanline-move {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(400%); }
        }
        .decode-container {
            background-color: #050510;
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
            box-shadow: inset 0 0 40px rgba(0, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        .decode-scanline {
            position: absolute;
            top: 0; left: 0; right: 0; height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.4), transparent);
            animation: scanline-move 2s linear infinite;
            pointer-events: none;
            z-index: 20;
        }
        .decode-text-glow {
            color: #22d3ee;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(34, 211, 238, 0.4);
        }
        
        /* --- 新增：嘉年華 (Carnival) 背景動畫 --- */
        @keyframes balloon-float {
            0% { transform: translateY(110vh) rotate(-5deg); opacity: 0; }
            10% { opacity: 0.95; }
            50% { transform: translateY(-10vh) rotate(5deg); }
            90% { opacity: 0.95; }
            100% { transform: translateY(-130vh) rotate(-5deg); opacity: 0; }
        }
        @keyframes spotlight-sweep {
            0% { transform: rotate(-30deg); opacity: 0; } /* 搖擺幅度縮小為 -30 度 */
            15% { opacity: 0.8; }
            50% { transform: rotate(30deg); opacity: 0.8; } /* 搖擺幅度縮小為 30 度 */
            85% { opacity: 0.8; }
            100% { transform: rotate(-30deg); opacity: 0; } /* 回到 -30 度 */
        }
        .carnival-spotlight {
            position: absolute;
            bottom: -30vh; /* 稍微往上收，不要拉太長 */
            width: 80vw;  /* 寬度從 120vw 縮小，讓光束變細 */
            height: 180vh; /* 高度縮短，不佔滿整個天際 */
            margin-left: -40vw; /* 配合寬度減半對齊 */
            clip-path: polygon(35% 0, 65% 0, 50.5% 100%, 49.5% 100%); /* 頂部裁切變窄 */
            transform-origin: bottom center;
            filter: blur(8px) drop-shadow(0 0 10px rgba(255,255,255,0.3)); /* 降低光暈擴散 */
            pointer-events: none;
            mix-blend-mode: screen; 
            z-index: 5;
        }
        .carnival-spotlight::after { /* 光束中心的超亮核心 */
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #ffffff 0%, rgba(255,255,255,0.5) 15%, transparent 60%); /* 提早變透明 */
            clip-path: polygon(47% 0, 53% 0, 50.2% 100%, 49.8% 100%); /* 核心變更細 */
            filter: blur(4px);
        }
        
        /* 玩具總動員 (Toy Story) 抽獎動畫 */
        @keyframes etch-shake {
            0%, 100% { transform: rotate(0deg) translate(0,0); }
            25% { transform: rotate(-1deg) translate(-2px, 2px); }
            50% { transform: rotate(1deg) translate(2px, -2px); }
            75% { transform: rotate(-1deg) translate(-2px, -2px); }
        }
        
        @keyframes claw-swing {
            0% { transform: translateX(-50%) rotate(-5deg); }
            100% { transform: translateX(-50%) rotate(5deg); }
        }
        
        .etch-frame {
            background-color: #dc2626;
            border-radius: 24px;
            box-shadow: inset 4px 4px 15px rgba(255,255,255,0.4), inset -4px -4px 15px rgba(0,0,0,0.2), 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 24px 12px 24px;
            position: relative;
        }
        
        .etch-screen {

        const processAndCompressImage = (file, maxWidth = 1920, maxHeight = 1080, quality = 0.8) => {
            return new Promise((resolve, reject) => {
                // 保留小型 GIF 動畫 (小於 3MB 不壓縮，避免動畫失效)
                if (file.type === 'image/gif' && file.size < 3 * 1024 * 1024) {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        // 計算等比例縮放
                        if (width > maxWidth || height > maxHeight) {
                            const ratio = Math.min(maxWidth / width, maxHeight / height);
                            width = Math.floor(width * ratio);
                            height = Math.floor(height * ratio);
                        }

                        // 使用 Canvas 進行重繪與壓縮
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 統一轉為 JPEG 確保最佳相容性與壓縮率
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = () => reject("圖片解析失敗");
                };
                reader.onerror = () => reject("檔案讀取失敗");
            });

                            beatOsc.stop(t + 0.1);

                    e.target.value = '';
                    return;

                    alert("圖片超過 4MB，為確保系統穩定，請使用容量較小的圖片");
                    e.target.value = '';
                    return;

                    updateSettings({ backgroundImage: event.target.result });

                                        </div>
                                    </div>

                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-gray-100 font-bold border-b text-gray-700">
                                                <tr>
                                                    <th className="p-3">編號 (ID)</th>

                                                    <th className="p-3">部門</th>

                                                {participants.slice(0, 100).map((p, i) => (
                                                    <tr key={i} className="hover:bg-blue-50 transition-colors">
                                                        <td className="p-3 font-mono text-gray-500">{p.id}</td>
                                                        <td className="p-3 font-bold text-gray-800">{p.name}</td>
                                                        <td className="p-3">{p.dept}</td>
                                                        <td className="p-3"><span className="bg-gray-100 px-2 py-0.5 rounded text-xs">{p.group || '-'}</span></td>
                                                        <td className="p-3">
                                                            {globalWinners.has(p.id) ? <span className="text-green-600 font-bold text-xs bg-green-50 px-2 py-1 rounded-full"><CheckCircle className="w-3 h-3 inline mr-1"/>已中獎</span> : absentWinners.has(p.id) ? <span className="text-red-500 font-bold text-xs bg-red-50 px-2 py-1 rounded-full"><UserX className="w-3 h-3 inline mr-1"/>缺席</span> : <span className="text-gray-400 text-xs">未抽</span>}

                                        {participants.length > 100 && (

                            {activeTab === 'import' && (
                                <div className="space-y-4">
                                    <div className="bg-blue-50 border border-blue-200 rounded p-4 shadow-sm">
                                        <h3 className="font-bold text-blue-800 mb-2 flex items-center gap-1"><AlertTriangle className="w-4 h-4"/> 從 Excel 匯入說明</h3>
                                        <ul className="list-disc list-inside text-sm text-blue-700 space-y-1 ml-1">
                                            <li>請直接從 Excel 複製表格內容，並貼在下方文字框。</li>
                                            <li>欄位順序必須為：<span className="font-bold text-blue-900 bg-blue-100 px-1 rounded">編號 (ID)</span> | <span className="font-bold text-blue-900 bg-blue-100 px-1 rounded">姓名</span> | <span className="font-bold text-blue-900 bg-blue-100 px-1 rounded">部門</span> | <span className="font-bold text-blue-900 bg-blue-100 px-1 rounded">分組</span>。</li>
                                            <li>請勿複製表頭 (標題列)，若不慎複製，匯入後請手動刪除第一筆。</li>
                                        </ul>

                                    <div className="flex gap-6 items-center p-3 bg-white border rounded shadow-sm">
                                        <label className="flex items-center gap-2 text-sm cursor-pointer font-bold text-gray-700">
                                            <input type="radio" checked={importMode === 'append'} onChange={() => { setImportMode('append'); soundManager.playClick(soundConfig?.click); }} className="text-blue-600 focus:ring-blue-500 w-4 h-4" /> 追加到現有名單 (以 ID 去除重複)

                                    <div className="flex justify-end">

                                    </div>
                                    <div className="space-y-3">
                                        {(!importHistory || importHistory.length === 0) ? (

                                        ) : (
                                            importHistory.map((historyItem, idx) => (

                                                    <div>

                                                            <Clock className="w-4 h-4 text-gray-400" /> 
                                                            {new Date(historyItem.timestamp).toLocaleString()}
                                                        </div>
                                                        <div className="text-sm text-gray-500 mt-1 flex items-center gap-1">
                                                            <Users className="w-3 h-3" /> 當時狀態共 <span className="font-bold text-blue-600">{historyItem.count}</span> 筆資料
                                                        </div>
                                                    </div>
                                                    <button onClick={() => restoreHistory(historyItem)} className="px-4 py-2 bg-green-50 text-green-700 border border-green-200 rounded font-bold text-sm hover:bg-green-100 flex items-center gap-2 transition-colors shadow-sm">
                                                        <RotateCcw className="w-4 h-4" /> 覆蓋並還原至此狀態
                                                    </button>

                                            ))

                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };
        const BackupConfirmModal = ({ pendingBackup, setPendingBackup, confirmRestoreBackup }) => { if (!pendingBackup) return null; return (<div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4"><div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl animate-scale-in"><div className="flex items-center gap-3 text-red-600 mb-4"><AlertTriangle className="w-8 h-8" /><h3 className="text-xl font-bold">確認還原備份？</h3></div><p className="text-gray-600 mb-6">這將會<span className="font-bold text-red-600">覆蓋</span>目前的抽獎名單、獎項設定與中獎紀錄。此動作無法復原。</p><div className="bg-gray-50 p-3 rounded mb-6 text-sm text-gray-500"><p>包含名單：{pendingBackup.participants?.length || 0} 人</p><p>包含獎項：{pendingBackup.prizes?.length || 0} 個</p></div><div className="flex gap-3"><button onClick={() => setPendingBackup(null)} className="flex-1 py-2 border rounded hover:bg-gray-50 text-gray-600 font-bold">取消</button><button onClick={confirmRestoreBackup} className="flex-1 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-bold shadow-lg">確認還原</button></div></div></div>) };

        const App = () => {
            const [isLoaded, setIsLoaded] = useState(false);
            const [participants, setParticipants] = useState([]);
            const [prizes, setPrizes] = useState(defaultPrizes);
            const [currentPrizeId, setCurrentPrizeId] = useState(defaultPrizes[0].id);
            const [globalWinners, setGlobalWinners] = useState(new Set());
            const [absentWinners, setAbsentWinners] = useState(new Set());
            const [themePresets, setThemePresets] = useState(DEFAULT_PRESETS);
            const [importHistory, setImportHistory] = useState([]); // 新增狀態：匯入歷史紀錄
            
            // --- 核心重構：Settings State ---
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);

            const [effectPos, setEffectPos] = useState({ x: 0, y: 0 });
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isDataModalOpen, setIsDataModalOpen] = useState(false);
            const [settingsTab, setSettingsTab] = useState('prizes');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [pendingBackup, setPendingBackup] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {} });
            const [isSpinning, setIsSpinning] = useState(false);
            const [showResultModal, setShowResultModal] = useState(false);
            const [currentRoundWinners, setCurrentRoundWinners] = useState([]);
            const [displayNames, setDisplayNames] = useState(['準備抽獎', '祝您中獎', '尾牙快樂']);
            const [displayData, setDisplayData] = useState([]);
            const [isLongPressing, setIsLongPressing] = useState(false);

            const mainBtnRef = useRef(null);
            const currentPrize = prizes.find(p => p.id === currentPrizeId) || prizes[0];

            // 輔助函式：更新設定 (支援單層與雙層更新)
            const updateSettings = (updates) => {
                setSettings(prev => ({ ...prev, ...updates }));
            };

            const theme = useMemo(() => {
                const { theme, customThemeColor } = settings;
                if (customThemeColor) {
                    return {
                        id: 'custom', name: '自訂主題',
                        primary: `bg-[${customThemeColor}]`, primaryHover: 'hover:opacity-90',
                        secondary: `bg-[${customThemeColor}]/10`, text: `text-[${customThemeColor}]`,
                        border: `border-[${customThemeColor}]`, gradient: `from-[${customThemeColor}] to-[${customThemeColor}]`,
                        gradientText: `from-[${customThemeColor}] to-[${customThemeColor}]`, bgGradient: `from-gray-900 to-black`,
                        cardBg: `bg-gray-900/80 border-[${customThemeColor}]/50 text-white`, boxBg: `bg-gray-900`
                    };
                }
                return THEMES[theme] || THEMES.toystory;
            }, [settings.theme, settings.customThemeColor]);

            const particleConfig = React.useMemo(() => {
                const generate = (count, minDur, addDur, minSize, addSize) => [...Array(count)].map((_, i) => ({ id: i, left: Math.random() * 100, top: Math.random() * 100, duration: minDur + Math.random() * addDur, delay: Math.random() * 5, size: minSize + Math.random() * addSize, color: ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6'][Math.floor(Math.random() * 5)] }));
                const generateSparkles = (count) => [...Array(count)].map((_, i) => { const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 70; return { id: i, tx: (Math.cos(angle) * distance).toFixed(2) + 'vw', ty: (Math.sin(angle) * distance).toFixed(2) + 'vh', duration: 3 + Math.random() * 3, delay: Math.random() * 3, size: 15 + Math.random() * 35 }; });
                const generateClouds = (count) => [...Array(count)].map((_, i) => ({ id: i, top: Math.random() * 90, scale: 0.6 + Math.random() * 0.8, duration: 30 + Math.random() * 40, delay: -Math.random() * 60 }));
                const generateToys = (count) => [...Array(count)].map((_, i) => ({ id: i, char: ['🧸', '🚀', '🦖', '🚗', '🎈', '🤖', '👑', '🚂', '🥁', '⚽'][Math.floor(Math.random() * 10)], left: Math.random() * 100, duration: 12 + Math.random() * 12, delay: Math.random() * 10, size: 24 + Math.random() * 30 }));
                
                // 新增：嘉年華氣球與探照燈生成器
                const generateBalloons = (count) => [...Array(count)].map((_, i) => ({ id: i, left: Math.random() * 100, duration: 12 + Math.random() * 15, delay: Math.random() * 10, size: 30 + Math.random() * 40, color: ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#A855F7', '#EC4899', '#14B8A6'][Math.floor(Math.random() * 7)] }));
                const generateSpotlights = () => [ 
                    { id: 1, left: '15%', duration: 4.2, delay: 0, color: 'rgba(34, 211, 238, 0.4)' },   /* 賽博青 (降低透明度) */
                    { id: 2, left: '35%', duration: 5.8, delay: -2, color: 'rgba(232, 121, 249, 0.4)' },  /* 霓虹粉 (降低透明度) */
                    { id: 3, left: '50%', duration: 4.5, delay: -1, color: 'rgba(255, 255, 255, 0.3)' },   /* 亮白 (降低透明度) */
                    { id: 4, left: '65%', duration: 6.1, delay: -3.5, color: 'rgba(56, 189, 248, 0.4)' }, /* 螢光藍 (降低透明度) */
                    { id: 5, left: '85%', duration: 5.2, delay: -4, color: 'rgba(250, 204, 21, 0.4)' }    /* 耀眼黃 (降低透明度) */
                ];
                
                // 新增：星空生成器
                const generateStars = (count) => [...Array(count)].map((_, i) => ({
                    id: `star-${i}`,
                    left: Math.random() * 100,
                    top: Math.random() * 100,
                    size: Math.random() * 2 + 1, // 1 到 3px
                    duration: 2 + Math.random() * 4, // 2s 到 6s
                    delay: Math.random() * 5
                }));

                return { 
                    sparkles: generateSparkles(40), 
                    confetti: generate(30, 5, 10, 0, 0), 
                    toystory: generateClouds(12), 
                    toystoryToys: generateToys(20),
                    carnivalBalloons: generateBalloons(35),
                    carnivalSpotlights: generateSpotlights(),
                    starryStars: generateStars(200)
                };
            }, []);

            const toggleFullscreen = () => {
                if (!document.fullscreenEnabled) return alert("無法啟用全螢幕模式。");
                if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(err => alert("無法進入全螢幕模式")); } else { if (document.exitFullscreen) document.exitFullscreen(); }
            };

            const openConfirm = (title, message, onConfirm) => { setConfirmModal({ isOpen: true, title, message, onConfirm: () => { onConfirm(); setConfirmModal(prev => ({ ...prev, isOpen: false })); } }); };

            // --- 讀取資料與遷移 (Migration Logic) ---
            useEffect(() => {
                const loadData = () => {
                    try {
                        const savedData = localStorage.getItem('luckyDrawData_v4'); // 升級為 v4
                        if (savedData) {
                            const parsed = JSON.parse(savedData);
                            setParticipants(parsed.participants || generateMockData(1000));
                            setPrizes(parsed.prizes || defaultPrizes);
                            setGlobalWinners(new Set(parsed.globalWinners || []));
                            setAbsentWinners(new Set(parsed.absentWinners || []));
                            setThemePresets(parsed.themePresets || DEFAULT_PRESETS);
                            setImportHistory(parsed.importHistory || []); // 載入歷史紀錄
                            if (parsed.currentPrizeId) setCurrentPrizeId(parsed.currentPrizeId);
                            if (parsed.settings) setSettings(prev => ({...prev, ...parsed.settings}));
                        } else {
                            // 嘗試從 v3 遷移資料
                            const v3Data = localStorage.getItem('luckyDrawData_v3');
                            if (v3Data) {
                                const p3 = JSON.parse(v3Data);
                                setParticipants(p3.participants || generateMockData(1000));
                                setPrizes(p3.prizes || defaultPrizes);
                                setGlobalWinners(new Set(p3.globalWinners || []));
                                setAbsentWinners(new Set(p3.absentWinners || []));
                                if (p3.currentPrizeId) setCurrentPrizeId(p3.currentPrizeId);
                                if (p3.themePresets) setThemePresets(p3.themePresets);
                                
                                // 遷移舊設定到新結構
                                setSettings(prev => ({
                                    ...prev,
                                    eventTitle: p3.eventTitle || prev.eventTitle,
                                    backgroundImage: p3.backgroundImage || prev.backgroundImage,
                                    logoImage: p3.logoImage || prev.logoImage,
                                    theme: p3.currentTheme || prev.theme,
                                    bgAnimation: p3.bgAnimation || prev.bgAnimation,
                                    spinAnimation: p3.spinAnimation || prev.spinAnimation,
                                    titleAnimation: p3.titleAnimation || prev.titleAnimation,
                                    buttonAnimation: p3.buttonAnimation || prev.buttonAnimation,
                                    startButtonText: p3.startButtonText || prev.startButtonText,
                                    boxThemeColor: p3.boxThemeColor || prev.boxThemeColor,
                                    customTextColor: p3.customTextColor || prev.customTextColor,
                                    customThemeColor: p3.customThemeColor || prev.customThemeColor,
                                    charge: {
                                        ...prev.charge,
                                        enabled: p3.isChargeEffectEnabled !== undefined ? p3.isChargeEffectEnabled : prev.charge.enabled,
                                        type: p3.chargeEffectType || prev.charge.type,
                                        intensity: p3.chargeEffectIntensity || prev.charge.intensity,
                                        x: p3.chargeEffectX || prev.charge.x,
                                        y: p3.chargeEffectY || prev.charge.y
                                    },
                                    toggles: {
                                        ...prev.toggles,
                                        sound: p3.isSoundEnabled !== undefined ? p3.isSoundEnabled : prev.toggles.sound,
                                        sidebarAuto: p3.isSidebarAutoToggleEnabled !== undefined ? p3.isSidebarAutoToggleEnabled : prev.toggles.sidebarAuto,
                                        settingsAuto: p3.isSettingsAutoToggleEnabled !== undefined ? p3.isSettingsAutoToggleEnabled : prev.toggles.settingsAuto
                                    },
                                    sound: p3.soundConfig || prev.sound
                                }));
                            } else {
                                setParticipants(generateMockData(1000));
                            }
                        }
                    } catch (e) {
                        console.error("Load failed", e);
                        setParticipants(generateMockData(1000));
                    } finally {
                        setIsLoaded(true);
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                soundManager.isMuted = !settings.toggles.sound;
            }, [settings.toggles.sound]);

            // --- 修正卡頓的關鍵：防抖動存檔 (Debounced Save) ---
            useEffect(() => {
                if (!isLoaded) return;

                // 設定 1000ms (1秒) 的延遲，避免在打字或快速操作時頻繁寫入硬碟
                const saveTimer = setTimeout(() => {
                    try {
                        const dataToSave = {
                            participants, prizes, globalWinners: Array.from(globalWinners), absentWinners: Array.from(absentWinners),
                            currentPrizeId, themePresets, settings, importHistory
                        };
                        localStorage.setItem('luckyDrawData_v4', JSON.stringify(dataToSave));
                        // console.log("Data auto-saved successfully"); // 除錯用
                    } catch (e) {
                        console.error("Auto-save failed (Storage might be full):", e);
                        // 如果是因為 QuotaExceededError (儲存空間滿)，可以在這裡做額外處理
                    }
                }, 1000);

                // 清除上一次的計時器，這就是防抖動的核心
                return () => clearTimeout(saveTimer);
            }, [participants, prizes, globalWinners, absentWinners, currentPrizeId, isLoaded, themePresets, settings, importHistory]);

            useEffect(() => {
                if (settings.spinAnimation === 'scratch' && isSpinning && scratchCanvasRef.current) {
                    const canvas = scratchCanvasRef.current;
                    const ctx = canvas.getContext('2d');
                    const width = canvas.offsetWidth;
                    const height = canvas.offsetHeight;
                    
                    // 根據設備像素比調整解析度，避免邊緣模糊
                    const dpr = window.devicePixelRatio || 1;
                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                    ctx.scale(dpr, dpr);

                    // 1. 填滿銀色金屬塗層
                    ctx.globalCompositeOperation = 'source-over';
                    const gradient = ctx.createLinearGradient(0, 0, width, height);
                    gradient.addColorStop(0, '#e5e7eb');
                    gradient.addColorStop(0.5, '#9ca3af');
                    gradient.addColorStop(1, '#d1d5db');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);

                    // 2. 加上塗層上的浮水印文字
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.font = 'bold 36px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    // 傾斜繪製文字圖案
                    ctx.save();
                    ctx.rotate(-15 * Math.PI / 180);
                    for(let x = -100; x < width + 200; x += 200) {
                        for(let y = -100; y < height + 200; y += 80) {
                            ctx.fillText('LUCKY', x, y);
                            ctx.fillText('SCRATCH', x + 100, y + 40);
                        }
                    }
                    ctx.restore();

                    // 3. 設定筆刷樣式 (擦除模式)
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    
                    let startTime = Date.now();
                    const duration = 3000; // 刮除動畫持續 3 秒 (留 0.5 秒展示結果)

                    // 產生 Z 字型的路徑點
                    const points = [];
                    const steps = 30; // 來回 30 趟
                    for(let i = 0; i <= steps; i++) {
                        const progress = i / steps;
                        const x = (i % 2 === 0) ? width * 0.05 : width * 0.95; // 左右交替
                        const y = height * progress; // 逐漸往下
                        points.push({x, y});
                    }

                    let lastX = points[0].x;
                    let lastY = points[0].y;
                    let currentTargetIndex = 1;

                    const animate = () => {
                        const now = Date.now();
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        if (progress < 1) {
                            // 計算目前應該刮到哪裡
                            const expectedTargetIndex = Math.min(Math.floor(progress * steps) + 1, steps);

                            if (expectedTargetIndex > currentTargetIndex) {
                                ctx.beginPath();
                                ctx.moveTo(lastX, lastY);
                                
                                // 加入一點隨機偏移，讓筆刷看起來像人手刮的
                                const target = points[expectedTargetIndex];
                                const jitterX = target.x + (Math.random() - 0.5) * 50;
                                const jitterY = target.y + (Math.random() - 0.5) * 50;
                                
                                // 隨機筆刷粗細 (40px ~ 100px)
                                ctx.lineWidth = 40 + Math.random() * 60;
                                ctx.lineTo(jitterX, jitterY);
                                ctx.stroke();

                                lastX = jitterX;
                                lastY = jitterY;
                                currentTargetIndex = expectedTargetIndex;
                            }
                            requestAnimationFrame(animate);
                        } else {
                            // 動畫結束，瞬間清除所有塗層
                            ctx.clearRect(0, 0, width, height);
                        }
                    };
                    
                    animate();
                }
            }, [isSpinning, settings.spinAnimation]); // 加入相依性陣列

            useEffect(() => { const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement); document.addEventListener('fullscreenchange', handleFullscreenChange); return () => document.removeEventListener('fullscreenchange', handleFullscreenChange); }, []);
            
            // --- 修改後的篩選邏輯：加入組別判斷與互斥設定 ---
            const getEligibleCandidates = (prize = currentPrize) => { 
                let candidates = prize.allowRepeat ? participants : participants.filter(p => !globalWinners.has(p.id)); 
                
                // 修改：如果獎項設定「允許缺席者中獎」，則不進行缺席過濾
                if (!prize.allowAbsent) {

                // 1. 如果獎項有設定 requiredGroup 且不是 'all'，則進行過濾
                if (prize.requiredGroup && prize.requiredGroup !== 'all') {
                    candidates = candidates.filter(p => p.group === prize.requiredGroup);
                }

                // 2. 新增：排除互斥獎項得主 (Exclusion Logic)
                if (prize.excludedPrizes && prize.excludedPrizes.length > 0) {

                    // 找出所有被排除獎項的得主 ID

                        p.winners.forEach(w => excludedWinnerIds.add(w.id));
                    });
                    // 從候選人中移除這些 ID
                    candidates = candidates.filter(p => !excludedWinnerIds.has(p.id));

                        for(let i=0; i<3; i++) {

                            if(rand) {

                const remaining = currentPrize.count - currentPrize.winners.length; 
                let needed; 
                if (isBatch) { 
                    const currentCount = currentPrize.winners.length; 
                    const remainder = currentCount % batchSize; 
                    if (remainder > 0) { needed = batchSize - remainder; } else { needed = batchSize; } 
                    needed = Math.min(needed, remaining); 
                } else {

                                <div className="carnival-charge-core">
                                    <div className="carnival-charge-beams"></div>
                                    <div className="carnival-disco-ball"></div>
                                </div>
                                {[...Array(16)].map((_, i) => { 
                                    const angle = (i / 16) * Math.PI * 2; 
                                    const dist = 180 + Math.random() * 100; 
                                    const tx = Math.cos(angle) * dist; 
                                    const ty = Math.sin(angle) * dist; 
                                    const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#A855F7', '#EC4899', '#14B8A6'];
                                    const color = colors[i % colors.length];
                                    return (
                                        <div key={`c-ball-${i}`} className="carnival-charge-balloon" style={{ '--tx': `${tx}px`, '--ty': `${ty}px`, '--bg-color': color, animationDelay: `${Math.random() * 1.5}s` }}></div>
                                    ); 
                                })}
                                {/* 新增：3 秒高潮爆發層 (全螢幕閃光、巨大震波、四射光芒) */}
                                <div className="carnival-climax-screen"></div>
                                <div className="carnival-climax-ring"></div>
                                <div className="carnival-climax-rays"></div>
                            </>
                        )}
                    </div>
                )}

                <SettingsPanel isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} prizes={prizes} setPrizes={setPrizes} currentPrizeId={currentPrizeId} setCurrentPrizeId={setCurrentPrizeId} globalWinnersCount={globalWinners.size} onExportCSV={exportToCSV} onFullReset={handleFullReset} onFactoryReset={handleFactoryReset} onExportBackup={handleExportBackup} onImportBackup={handleImportBackup} settingsTab={settingsTab} setSettingsTab={setSettingsTab} theme={theme} absentWinners={absentWinners} onRestoreAbsent={handleRestoreAbsent} participants={participants} settings={settings} updateSettings={updateSettings} themePresets={themePresets} setThemePresets={setThemePresets} />
                <DataImportModal isOpen={isDataModalOpen} onClose={() => setIsDataModalOpen(false)} participants={participants} setParticipants={setParticipants} setGlobalWinners={setGlobalWinners} generateMockData={generateMockData} globalWinners={globalWinners} theme={theme} absentWinners={absentWinners} soundConfig={settings.sound} importHistory={importHistory} setImportHistory={setImportHistory} />
                <ResultModal isOpen={showResultModal} onClose={() => setShowResultModal(false)} currentPrize={currentPrize} currentRoundWinners={currentRoundWinners} theme={theme} allPrizes={prizes} onReplaceWinner={handleBatchAbsence} openConfirm={openConfirm} boxThemeColor={boxThemeColor} boxBackgroundColor={settings.boxBackgroundColor} resultModalBgColor={settings.resultModalBgColor} resultCardBgColor={settings.resultCardBgColor} resultCardTextColor={settings.resultCardTextColor} soundConfig={settings.sound} />
                <BackupConfirmModal pendingBackup={pendingBackup} setPendingBackup={setPendingBackup} confirmRestoreBackup={confirmRestoreBackup} />
                <ConfirmModal isOpen={confirmModal.isOpen} title={confirmModal.title} message={confirmModal.message} onConfirm={confirmModal.onConfirm} onCancel={() => setConfirmModal(prev => ({ ...prev, isOpen: false }))} soundConfig={settings.sound} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
