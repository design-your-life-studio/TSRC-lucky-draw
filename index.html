<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw Pro</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    
    <!-- 引入 Google Fonts (Press Start 2P) 用於像素風 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* 避免 Google Sites iframe 滾動條問題 */
        body { margin: 0; padding: 0; overflow: hidden; }
        /* 強制隱藏 root 的滾動條，確保畫面固定 */
        #root { height: 100vh; width: 100vw; overflow: hidden; }

        /* --- 自定義動畫 Keyframes --- */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        
        /* 滾動條樣式 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); border-radius: 4px; }
        
        .bg-custom { background-size: cover; background-position: center; }

        /* 背景粒子動畫 */
        @keyframes gold-scatter {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotate(0deg); 
                opacity: 0; 
            }
            10% { 
                opacity: 1; 
                transform: translate(calc(var(--tx) * 0.1 - 50%), calc(var(--ty) * 0.1 - 50%)) scale(1) rotate(45deg); 
                filter: brightness(150%) drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            }
            100% { 
                transform: translate(calc(var(--tx) - 50%), calc(var(--ty) - 50%)) scale(0) rotate(180deg); 
                opacity: 0; 
            }
        }

        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .bg-aurora { background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fbc2eb, #e0c3fc); background-size: 400% 400%; animation: aurora 15s ease infinite; }
        
        /* 童趣樂園 (玩具漂浮) 動畫 */
        @keyframes toy-float-up {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-70vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        /* Modal 動畫 */
        @keyframes scale-in {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in { animation: scale-in 0.2s ease-out forwards; }

        @keyframes slide-in-right {
            0% { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out forwards; }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }

        /* 背景特效動畫 */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 玩具總動員背景 */
        .bg-toystory {
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 100%);
            background-size: cover;
        }

        @keyframes cloud-drift {
            from { transform: translateX(-150px); }
            to { transform: translateX(100vw); }
        }

        /* 按鈕特效動畫 */
        @keyframes btn-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .animate-btn-shake { animation: btn-shake 2s infinite; }

        @keyframes btn-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-btn-spin { animation: btn-rotate 8s linear infinite; }

        @keyframes btn-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); transform: scale(1); }
            50% { box-shadow: 0 0 60px rgba(255,215,0,1); transform: scale(1.05); }
        }
        .animate-btn-glow { animation: btn-glow 2s infinite; }

        @keyframes btn-heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
        .animate-btn-pulse { animation: btn-heartbeat 3s infinite; }

        /* ----------------------------------------------------------- */
        /* --- 蓄力特效動畫定義區 (Charge Effects) --- */
        /* ----------------------------------------------------------- */

        /* 1. 預設：閃光脈衝 (Flash) */
        @keyframes charge-flash-core {
            0% { opacity: 0; transform: scale(0.5); filter: brightness(1); }
            50% { opacity: 1; transform: scale(var(--charge-scale, 1.2)); filter: brightness(1.5) drop-shadow(0 0 30px gold); }
            100% { opacity: 0; transform: scale(var(--charge-scale, 1.5)); filter: brightness(2); }
        }
        @keyframes charge-flash-particles-spin {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.4) rotate(180deg); opacity: 0; }
        }

        /* 2. 霓虹聚光 (Implode) */
        @keyframes charge-implode-anim {
            0% { 
                transform: scale(2.5); 
                opacity: 0; 
                border-width: 4px; 
            }
            30% { opacity: 1; }
            100% { 
                transform: scale(0); 
                opacity: 0; 
                border-width: 20px; 
            }
        }

        /* 3. 玩具總動員 (Toy Story) */
        @keyframes toy-badge-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        @keyframes toy-pop-out {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translate(calc(var(--tx) * 0.3), calc(var(--ty) * 0.3)) scale(1.2) rotate(72deg); }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(360deg); opacity: 0; }
        }
        
        @keyframes toy-rainbow-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes toy-rainbow-appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .toy-rainbow-wrapper {
            position: absolute;
            inset: -200px;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: toy-rainbow-appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 3s;
            pointer-events: none;
        }

        .toy-rainbow-rays {
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(
                from 0deg,
                #ef4444 0deg 15deg, #f97316 15deg 30deg, #facc15 30deg 45deg,
                #22c55e 45deg 60deg, #3b82f6 60deg 75deg, #a855f7 75deg 90deg, #ef4444 90deg 105deg
            );
            mask-image: radial-gradient(circle, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%);
            animation: toy-rainbow-spin 10s linear infinite;
            filter: brightness(1.2);
        }
        
        /* 4. 巴斯光年 (Buzz Lightyear) */
        @keyframes buzz-ring-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes buzz-wings-deploy {
            0% { width: 40px; opacity: 0; }
            60% { width: 320px; opacity: 1; }
            80% { width: 280px; }
            100% { width: 300px; }
        }
        @keyframes buzz-fly-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            10% { transform: translateY(20px) scale(0.95); }
            20% { transform: translateY(0) scale(1.1); }
            100% { transform: translateY(-150vh) scale(0.5); opacity: 0; }
        }
        @keyframes buzz-jet-flow {
            0% { height: 0; opacity: 0; }
            10% { height: 100px; opacity: 1; }
            100% { height: 600px; opacity: 0; }
        }
        @keyframes buzz-smoke-puff {
            0% { transform: scale(0.2); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; filter: blur(10px); }
        }
        @keyframes buzz-star-flash {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1) rotate(45deg); }
            100% { transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) * 1.5)) scale(0) rotate(90deg); opacity: 0; }
        }

        .effect-buzz {
            mix-blend-mode: normal !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(75, 0, 130, 0.2) 0%, transparent 60%); 
        }

        .buzz-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .buzz-flying-group {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: buzz-fly-up 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards 3s;
        }

        .buzz-jet-beam {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 0;
            background: linear-gradient(to bottom, #fff, #22d3ee, #e879f9, #facc15, transparent);
            z-index: 1;
            border-radius: 0 0 20px 20px;
            filter: blur(5px);
            animation: buzz-jet-flow 0.8s ease-out forwards 3s;
        }

        .buzz-ring-purple {
            position: absolute;
            inset: 15px;
            border: 8px solid #9333ea;
            border-top-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: buzz-ring-rotate 3s linear infinite;
            filter: drop-shadow(0 0 5px rgba(147, 51, 234, 0.8));
            z-index: 15;
        }
        
        .buzz-ring-green {
            position: absolute;
            inset: 40px;
            border: 8px solid #4ade80;
            border-left-color: transparent;
            border-right-color: transparent;
            border-radius: 50%;
            animation: buzz-ring-rotate 2s linear infinite reverse;
            filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.8));
            z-index: 15;
        }

        .buzz-core {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ffffff 40%, #d1d5db 100%);
            border: 5px solid #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .buzz-wings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 80px;
            width: 300px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            animation: buzz-wings-deploy 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .buzz-wing-left, .buzz-wing-right {
            width: 42%;
            height: 100%;
            background: linear-gradient(to bottom, #9333ea, #7e22ce);
            border: 3px solid #e5e7eb;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .buzz-wing-left { border-radius: 20px 0 0 20px; border-right: none; }
        .buzz-wing-right { border-radius: 0 20px 20px 0; border-left: none; }
        
        .buzz-wing-stripes {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            height: 25px;
            background: repeating-linear-gradient(90deg, #ef4444, #ef4444 15px, #ffffff 15px, #ffffff 30px);
        }

        .buzz-aftermath {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            pointer-events: none;
        }

        .buzz-smoke {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #a855f7 0%, #d8b4fe 40%, transparent 80%);
            opacity: 0;
            animation: buzz-smoke-puff 1.2s ease-out forwards 3.1s;
        }

        .buzz-star {
            position: absolute;
            color: #facc15;
            opacity: 0;
            animation: buzz-star-flash 1s ease-out forwards;
        }

        /* 特效通用定位容器 */
        .effect-charge-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            margin-top: -500px;
            margin-left: -500px;
            z-index: 100;
            pointer-events: none;
            mix-blend-mode: screen; 
        }

        .effect-flash {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 223, 0, 0.6) 30%, rgba(255, 140, 0, 0.2) 60%, transparent 70%);
            animation: charge-flash-core 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .effect-flash::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px dashed rgba(255, 255, 255, 0.5); transform: scale(0.9); animation: charge-flash-particles-spin 2s linear infinite;
        }
        .effect-flash::after {
            content: ''; position: absolute; inset: -10%; border-radius: 50%; background-image: radial-gradient(circle, #fff 2px, transparent 3px); background-size: 50px 50px; opacity: 0.6; animation: charge-flash-particles-spin 2s linear infinite reverse;
        }

        .effect-implode {
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .implode-ring {
            position: absolute;
            inset: 0;
            margin: auto;
            border-radius: 50%;
            border-style: solid;
            box-shadow: 0 0 30px currentColor, inset 0 0 20px currentColor;
            opacity: 0;
            animation: charge-implode-anim 1.2s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
            mix-blend-mode: screen;
        }

        .effect-countdown { background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, transparent 70%); display: flex; justify-content: center; align-items: center; }
        .countdown-wrapper { position: relative; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; }
        .countdown-ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid transparent; border-top-color: rgba(251, 191, 36, 0.8); border-right-color: rgba(245, 158, 11, 0.6); border-bottom-color: rgba(251, 191, 36, 0.4); box-shadow: 0 0 20px rgba(245, 158, 11, 0.6), inset 0 0 20px rgba(245, 158, 11, 0.4); animation: countdown-ring-spin 3.5s linear infinite; }
        .countdown-pulse { position: absolute; inset: 15%; border-radius: 50%; background: radial-gradient(circle, rgba(251, 191, 36, 0.4) 0%, transparent 70%); filter: blur(10px); animation: countdown-pulse-anim 1.75s ease-in-out infinite alternate; }
        .countdown-num { position: absolute; font-size: 140px; font-weight: 900; color: #fff; -webkit-text-stroke: 2px #d97706; text-shadow: 0 0 10px #fff, 0 0 30px #fbbf24, 0 0 60px #f59e0b; opacity: 0; font-family: 'Arial Black', sans-serif; line-height: 1; z-index: 10; }
        .c-3 { animation: count-anim 3.5s linear forwards; animation-delay: 0s; }
        .c-2 { animation: count-anim 3.5s linear forwards; animation-delay: 0.875s; }
        .c-1 { animation: count-anim 3.5s linear forwards; animation-delay: 1.75s; }
        
        .effect-toystory {
            mix-blend-mode: normal !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(135,206,235,0.3) 0%, transparent 60%);
        }
        .toy-badge-container {
            position: relative;
            width: 140px;
            height: 140px;
            background: #FACC15;
            border: 12px solid #3B82F6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.3);
            animation: toy-badge-bounce 0.6s ease-in-out infinite;
            z-index: 20;
        }
        .toy-badge-star {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        
        .toy-particle {
            position: absolute;
            font-size: 70px;
            z-index: 10;
            animation: toy-pop-out 1s ease-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* 隱形觸發區域 */
        .sidebar-trigger-zone {
            position: fixed; top: 0; left: 0; bottom: 0; width: 20px; z-index: 50;
        }
        .settings-trigger-zone {
            position: fixed; top: 0; right: 0; bottom: 0; width: 20px; z-index: 45;
        }

        /* --- 標題文字動畫 Keyframes --- */
        @keyframes text-shine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        .animate-text-shine {
            background-image: linear-gradient(to right, currentColor 20%, #fff 40%, #fff 60%, currentColor 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: text-shine 3s linear infinite;
        }

        @keyframes text-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-text-float { animation: text-float 3s ease-in-out infinite; }

        @keyframes text-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-text-pop { animation: text-pop 2s ease-in-out infinite; }

        /* --- 拋物線彩帶動畫 (Parabolic Confetti) --- */
        @keyframes confetti-flight-x {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--end-x)); }
        }
        @keyframes confetti-flight-y {
            0% { 
                transform: translateY(0); 
                opacity: 1;
                animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
            }
            50% { 
                transform: translateY(var(--apex-y)); 
                animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
            }
            85% { opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
        @keyframes confetti-spin-axis {
            0% { transform: rotate(0deg) rotateX(0deg); }
            100% { transform: rotate(var(--rot-z)) rotateX(var(--rot-x)); }
        }

        /* --- 老虎機 (Slot Machine) 動畫 --- */
        @keyframes slot-spin-blur {
            0% { transform: translateY(-30px); filter: blur(1px); }
            50% { transform: translateY(30px); filter: blur(4px); }
            100% { transform: translateY(-30px); filter: blur(1px); }
        }
        @keyframes slot-light-blink {
            0%, 100% { background-color: #facc15; box-shadow: 0 0 5px #facc15; transform: scale(1); }
            50% { background-color: #fff; box-shadow: 0 0 15px #fff; transform: scale(1.2); }
        }
        .slot-machine-frame {
            background: linear-gradient(180deg, #dc2626 0%, #b91c1c 40%, #7f1d1d 100%);
            border: 8px solid #f59e0b;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 20px 50px rgba(0,0,0,0.8), 0 0 0 10px #b45309;
            border-radius: 30px;
            position: relative;
        }

        .slot-window {
            background: #f8fafc;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            border: 6px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .slot-window::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .slot-light {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #facc15;
            border: 2px solid #b45309;
            z-index: 10;
        }
        .animate-slot-spin {
            animation: slot-spin-blur 0.1s linear infinite;
        }
        
        /* 玩具總動員 (Toy Story) 抽獎動畫 */
        @keyframes etch-shake {
            0%, 100% { transform: rotate(0deg) translate(0,0); }
            25% { transform: rotate(-1deg) translate(-2px, 2px); }
            50% { transform: rotate(1deg) translate(2px, -2px); }
            75% { transform: rotate(-1deg) translate(-2px, -2px); }
        }
        
        @keyframes claw-swing {
            0% { transform: translateX(-50%) rotate(-5deg); }
            100% { transform: translateX(-50%) rotate(5deg); }
        }
        
        .etch-frame {
            background-color: #dc2626;
            border-radius: 24px;
            box-shadow: inset 4px 4px 15px rgba(255,255,255,0.4), inset -4px -4px 15px rgba(0,0,0,0.2), 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 24px 12px 24px;
            position: relative;
        }
        
        .etch-screen {
            background-color: #d1d5db;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            border-radius: 12px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
        }
        
        .etch-screen::before {
            content: '';
            position: absolute;
            inset: 0;

                    soundManager.chargeOsc.frequency.linearRampToValueAtTime(endFreq, endTime); 
                }

                soundManager.chargeGain.gain.setValueAtTime(vol, now);
                soundManager.chargeGain.gain.setValueAtTime(vol, endTime); 
                soundManager.chargeGain.gain.exponentialRampToValueAtTime(0.001, endTime + fadeDuration); 
                
                sourceNode.connect(soundManager.chargeGain);
                
                soundManager.chargeGain.connect(soundManager.ctx.destination);
                
                if (soundManager.chargeOsc) {
                     soundManager.chargeOsc.start();
                }
                
                if (soundManager.chargeOsc) soundManager.chargeOsc.stop(endTime + fadeDuration + 0.1);
                if (soundManager.chargeOsc2) soundManager.chargeOsc2.stop(endTime + fadeDuration + 0.1);
            },
            stopCharge: () => {
                if (soundManager.chargeOsc) {
                    try {
                        soundManager.chargeOsc.stop();
                    } catch(e){}
                    soundManager.chargeOsc = null;
                    soundManager.chargeGain = null;
                }
                if (soundManager.chargeOsc2) {
                    try {
                        soundManager.chargeOsc2.stop();
                    } catch(e){}
                    soundManager.chargeOsc2 = null;
                    soundManager.chargeGain2 = null;

            }, [participants, prizes, globalWinners, absentWinners, currentPrizeId, isLoaded, themePresets, settings, importHistory]);

            useEffect(() => { const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement); document.addEventListener('fullscreenchange', handleFullscreenChange); return () => document.removeEventListener('fullscreenchange', handleFullscreenChange); }, []);
            
            // --- 修改後的篩選邏輯：加入組別判斷與互斥設定 ---
            const getEligibleCandidates = (prize = currentPrize) => { 
                let candidates = prize.allowRepeat ? participants : participants.filter(p => !globalWinners.has(p.id)); 
                
                // 修改：如果獎項設定「允許缺席者中獎」，則不進行缺席過濾
                if (!prize.allowAbsent) {
                    candidates = candidates.filter(p => !absentWinners.has(p.id)); 
                }
                
                // 1. 如果獎項有設定 requiredGroup 且不是 'all'，則進行過濾
                if (prize.requiredGroup && prize.requiredGroup !== 'all') {
                    candidates = candidates.filter(p => p.group === prize.requiredGroup);
                }

                // 2. 新增：排除互斥獎項得主 (Exclusion Logic)
                if (prize.excludedPrizes && prize.excludedPrizes.length > 0) {
                    const excludedWinnerIds = new Set();
                    // 找出所有被排除獎項的得主 ID
                    prizes.filter(p => prize.excludedPrizes.includes(p.id)).forEach(p => {
                        p.winners.forEach(w => excludedWinnerIds.add(w.id));
                    });
                    // 從候選人中移除這些 ID
                    candidates = candidates.filter(p => !excludedWinnerIds.has(p.id));
                }

                const currentPrizeWinnerIds = new Set(prize.winners.map(w => w.id)); 
                return candidates.filter(p => !currentPrizeWinnerIds.has(p.id)); 
            };

            useEffect(() => { 
                let interval; 
                if (isSpinning) { 
                    const candidates = getEligibleCandidates(); 
                    const animPool = candidates.length > 0 ? candidates : participants; 
                    interval = setInterval(() => { 
                        const randomNames = []; 
                        const randomData = []; 
                        for(let i=0; i<3; i++) { 
                            const rand = animPool[Math.floor(Math.random() * animPool.length)]; 
                            if(rand) {
                                randomNames.push(`${rand.dept} ${rand.name}`); 
                                randomData.push(rand); 
                            }
                        } 
                        setDisplayNames(randomNames); 
                        setDisplayData(randomData); 
                        soundManager.playSpin(settings.sound.spin); 
                    }, 60); 
                } else { 
                    setDisplayNames(['準備抽獎', '祝您中獎', '尾牙快樂']); 
                    setDisplayData([]); 
                } 
                return () => clearInterval(interval); 
            }, [isSpinning, participants, prizes, currentPrizeId, globalWinners, absentWinners, settings.sound.spin]);
            
            const handleDraw = () => { 
                soundManager.playClick(settings.sound.click);
                const eligible = getEligibleCandidates(currentPrize); 
                if (currentPrize.drawn) return alert("此獎項已經抽過了！"); 
                const isBatch = currentPrize.isBatch; 
                const batchSize = currentPrize.batchSize || 1; 
                const remaining = currentPrize.count - currentPrize.winners.length; 
                let needed; 
                if (isBatch) { 
                    const currentCount = currentPrize.winners.length; 
                    const remainder = currentCount % batchSize; 
                    if (remainder > 0) { needed = batchSize - remainder; } else { needed = batchSize; } 
                    needed = Math.min(needed, remaining); 
                } else { 
                    needed = remaining; 
                } 
                if (eligible.length < needed) return alert(`候選人數不足！剩餘 ${eligible.length} 人。`); 
                setIsSpinning(true); 
                setShowResultModal(false); 
                const duration = 3500; 
                setTimeout(() => { performFinalSelection(currentPrize, eligible, needed); }, duration); 
            };
            
            const performFinalSelection = (prize, pool, countToDraw) => { 
                const winners = []; 
                const poolCopy = [...pool]; 
                for (let i = 0; i < countToDraw; i++) { 
                    if (poolCopy.length === 0) break; 
                    const randomIndex = Math.floor(Math.random() * poolCopy.length); 
                    const baseWinner = poolCopy[randomIndex]; 
                    const winner = { ...baseWinner, drawnAt: new Date().toISOString() };
                    winners.push(winner); 
                    poolCopy.splice(randomIndex, 1); 
                } 
                const newGlobalWinners = new Set(globalWinners); 
                winners.forEach(w => newGlobalWinners.add(w.id)); 
                const updatedWinners = [...prize.winners, ...winners]; 
                const isFinished = updatedWinners.length >= prize.count; 
                const updatedPrizes = prizes.map(p => { if (p.id === prize.id) return { ...p, drawn: isFinished, winners: updatedWinners }; return p; }); 
                setGlobalWinners(newGlobalWinners); 
                setPrizes(updatedPrizes); 
                setCurrentRoundWinners(winners); 
                setIsSpinning(false); 
                setShowResultModal(true);

            };
            
            const handleBatchAbsence = (prizeId, absentIds) => { if (absentIds.length === 0) return; const newAbsentWinners = new Set(absentWinners); absentIds.forEach(id => newAbsentWinners.add(id)); setAbsentWinners(newAbsentWinners); const newGlobalWinners = new Set(globalWinners); absentIds.forEach(id => newGlobalWinners.delete(id)); setGlobalWinners(newGlobalWinners); setPrizes(prevPrizes => prevPrizes.map(p => { if (p.id === prizeId) { const newWinners = p.winners.filter(w => !absentIds.includes(w.id)); return { ...p, winners: newWinners, drawn: false }; } return p; })); };

            const handleExportBackup = () => { const data = localStorage.getItem('luckyDrawData_v4'); if (!data) return alert("目前沒有資料可備份"); const blob = new Blob([data], { type: "application/json" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `LuckyDraw_Backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(link); link.click(); document.body.removeChild(link); };

            const confirmRestoreBackup = () => {

                                                 <style>{`.slot-machine-frame::before { display: none; }`}</style>
                                                 <div className="absolute top-2 left-4 right-4 flex justify-between px-4 opacity-80">{[...Array(12)].map((_,i) => <div key={i} className="slot-light" style={{animation: `slot-light-blink 0.6s infinite alternate ${i*0.1}s`, width: '12px', height: '12px'}}></div>)}</div>
                                                 <div className="relative z-10 bg-black/40 px-10 py-2 rounded-lg mb-6 border-y-2 border-yellow-500/50 backdrop-blur-sm shadow-[0_5px_15px_rgba(0,0,0,0.3)]"><div className="text-yellow-400 font-black text-2xl tracking-[0.3em] drop-shadow-[0_2px_0_rgba(180,83,9,1)]">LUCKY SLOTS</div></div>
                                                 <div className="flex gap-1 md:gap-3 w-[95%] max-w-5xl h-48 md:h-60 slot-window p-2 md:p-3 bg-gradient-to-b from-gray-800 to-gray-900 border-4 border-yellow-600/30 shadow-inner rounded-md">
                                                     <div className="flex-1 bg-gray-100 border-r border-l border-gray-300 relative overflow-hidden flex flex-col items-center justify-center rounded-sm shadow-[inset_0_0_20px_rgba(0,0,0,0.2)]">
                                                         {(() => { const d1 = displayData[0] || { dept: '---', name: '---', id: '---' }; const d2 = displayData[1] || { dept: '---', name: '---', id: '---' }; const d3 = displayData[2] || { dept: '---', name: '---', id: '---' }; return (<div className="animate-slot-spin flex flex-col gap-8 text-center w-full"><span className="text-lg text-gray-400 font-bold blur-[2px]">{d3.dept}</span><span className="text-2xl md:text-4xl font-black text-gray-800 py-4 scale-110">{d1.dept}</span><span className="text-lg text-gray-400 font-bold blur-[2px]">{d2.dept}</span></div>); })()}
                                                         <div className="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/20 pointer-events-none z-10"></div>
                                                     </div>
                                                     <div className="flex-1 bg-white border-r border-l border-gray-300 relative overflow-hidden flex flex-col items-center justify-center rounded-sm shadow-[inset_0_0_20px_rgba(0,0,0,0.1)]">
                                                         {(() => { const d1 = displayData[0] || { dept: '---', name: '---', id: '---' }; const d2 = displayData[1] || { dept: '---', name: '---', id: '---' }; const d3 = displayData[2] || { dept: '---', name: '---', id: '---' }; return (<div className="animate-slot-spin flex flex-col gap-8 text-center w-full" style={{animationDirection: 'reverse', animationDuration: '0.08s'}}><span className="text-lg text-gray-400 font-bold blur-[2px]">{d1.name}</span><span className="text-3xl md:text-5xl font-black text-blue-600 py-4 scale-110">{d2.name}</span><span className="text-lg text-gray-400 font-bold blur-[2px]">{d3.name}</span></div>); })()}
                                                         <div className="absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/10 pointer-events-none z-10"></div>
                                                     </div>
                                                     <div className="flex-1 bg-gray-100 border-r border-l border-gray-300 relative overflow-hidden flex flex-col items-center justify-center rounded-sm shadow-[inset_0_0_20px_rgba(0,0,0,0.2)]">
                                                         {(() => { const d1 = displayData[0] || { dept: '---', name: '---', id: '---' }; const d2 = displayData[1] || { dept: '---', name: '---', id: '---' }; const d3 = displayData[2] || { dept: '---', name: '---', id: '---' }; return (<div className="animate-slot-spin flex flex-col gap-8 text-center w-full" style={{animationDuration: '0.12s'}}><span className="text-lg text-gray-400 font-mono font-bold blur-[2px]">{d2.id}</span><span className="text-2xl md:text-4xl font-mono font-black text-red-600 py-4 scale-110">{d3.id}</span><span className="text-lg text-gray-400 font-mono font-bold blur-[2px]">{d1.id}</span></div>); })()}
                                                         <div className="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/20 pointer-events-none z-10"></div>
                                                     </div>
                                                 </div>
                                                 <div className="absolute bottom-4 left-4 right-4 flex justify-between px-4 opacity-80">{[...Array(12)].map((_,i) => <div key={i} className="slot-light" style={{animation: `slot-light-blink 0.6s infinite alternate-reverse ${i*0.1}s`, width: '12px', height: '12px'}}></div>)}</div>
                                             </div>
                                        </div>
                                    ) : spinAnimation === 'toy_story' ? (
                                        <div className="w-[calc(100%+4rem)] h-[calc(100%+4rem)] -m-8 relative flex items-center justify-center p-4 bg-[#87CEEB] overflow-hidden">
                                            <div className="absolute inset-0 opacity-40 pointer-events-none">
                                                {[...Array(12)].map((_, i) => (
                                                    <div key={i} className="absolute text-white" style={{ top: `${Math.random()*100}%`, left: `${Math.random()*100}%`, transform: `scale(${0.6 + Math.random() * 0.4})` }}>
                                                        <svg width="100" height="60" viewBox="0 0 100 60" fill="currentColor" style={{ filter: 'drop-shadow(1px 2px 0px rgba(0,0,0,0.1))' }}><circle cx="30" cy="38" r="14" /><circle cx="70" cy="38" r="14" /><circle cx="50" cy="28" r="19" /><rect x="30" y="32" width="40" height="20" /></svg>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="toy-claw-arm"><div className="toy-claw-hand"></div></div>
                                            <div className="etch-frame w-full max-w-2xl h-64 md:h-80 shadow-2xl z-10 animate-[etch-shake_0.2s_linear_infinite]">
                                                <div className="etch-gold-label">Magic Sketch</div>
                                                <div className="etch-screen border-4 border-gray-300/50">
                                                    <div className="flex flex-col items-center gap-2 md:gap-4 transition-all w-full text-center px-4">
                                                        <div className="text-xl text-gray-600 font-bold opacity-75 transform -rotate-1 truncate w-full">{displayNames[1] || '---'}</div>
                                                        <div className="text-4xl md:text-6xl text-gray-800 font-black tracking-widest uppercase opacity-90 truncate w-full" style={{ textShadow: '2px 2px 0px rgba(0,0,0,0.1)' }}>{displayNames[0]}</div>
                                                        <div className="text-xl text-gray-600 font-bold opacity-75 transform rotate-1 truncate w-full">{displayNames[2] || '---'}</div>
                                                    </div>
                                                </div>
                                                <div className="flex justify-between w-full px-4 md:px-12 mt-3"><div className="etch-knob animate-spin-slow" style={{animationDuration: '3s'}}></div><div className="etch-knob animate-spin-slow" style={{animationDuration: '3s', animationDirection: 'reverse'}}></div></div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-full h-full flex items-center justify-center relative overflow-hidden">
                                            <div className="flex flex-col items-center gap-4 transition-all duration-75 blur-[1px]">
                                            <div className="text-5xl font-black opacity-100 whitespace-nowrap" style={{ color: boxThemeColor }}>{displayNames[0]}</div>
                                            <div className="text-4xl font-black opacity-50 whitespace-nowrap" style={{ color: boxThemeColor }}>{displayNames[1]}</div>
                                            <div className="text-3xl font-black opacity-20 whitespace-nowrap" style={{ color: boxThemeColor }}>{displayNames[2]}</div>
                                            </div>
                                        </div>
                                    )
                                ) : (
                                    <div className={`text-center w-full h-full flex flex-col items-center justify-center transition-opacity duration-300 ${isLongPressing && !['implode', 'sniper'].includes(charge.type) ? 'opacity-0' : 'opacity-100'}`}>
                                        {currentPrize.image ? (
                                            <div className="h-56 w-full flex items-center justify-center mb-8">
                                                <div ref={mainBtnRef} className={`relative p-3 bg-white rounded-3xl shadow-[0_0_30px_rgba(255,215,0,0.4)] border-4 transform transition-transform duration-200 cursor-pointer select-none ${isLongPressing ? 'scale-95' : 'hover:rotate-1'}`} style={{ borderColor: boxThemeColor }} onMouseDown={handlePressStart} onMouseUp={handlePressEnd} onMouseLeave={handlePressCancel} onTouchStart={handlePressStart} onTouchEnd={handlePressEnd}>
                                                    <img src={currentPrize.image} className="h-48 w-auto object-contain rounded-xl relative z-10" />
                                                </div>
                                            </div>
                                        ) : (
                                            <div ref={mainBtnRef} className="relative w-32 h-32 md:w-40 md:h-40 mx-auto mb-6 group cursor-pointer select-none" onMouseDown={handlePressStart} onMouseUp={handlePressEnd} onMouseLeave={handlePressCancel} onTouchStart={handlePressStart} onTouchEnd={handlePressEnd}>
                                                <div className={`absolute inset-0 ${theme.primary} rounded-full opacity-20 ${buttonAnimation === 'ping' ? 'animate-ping' : ''} ${buttonAnimation === 'pulse' ? 'animate-btn-pulse' : ''} ${buttonAnimation === 'glow' ? 'animate-btn-glow' : ''} `}></div>
                                                <div className={`absolute inset-0 bg-gradient-to-br ${theme.gradient} rounded-full shadow-[0_10px_20px_rgba(0,0,0,0.3)] border-4 flex items-center justify-center transform transition-transform duration-200 ${isLongPressing ? 'scale-90' : (buttonAnimation === 'none' ? '' : 'group-hover:scale-105')} ${buttonAnimation === 'bounce' && !isLongPressing ? 'animate-bounce' : ''} ${buttonAnimation === 'shake' && !isLongPressing ? 'animate-btn-shake' : ''} ${buttonAnimation === 'spin' && !isLongPressing ? 'animate-btn-spin' : ''}`} style={{ borderColor: boxThemeColor }}>
                                                    <span className="text-2xl md:text-3xl font-black text-white tracking-widest uppercase">{startButtonText}</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                                </div>
                                {/* 下方白色資訊列已移除 */}
                            </div>
                            <div className="flex flex-col items-center gap-3 w-full">
                                <div className="h-16 flex items-center justify-center w-full">
                                    <button onMouseDown={handlePressStart} onMouseUp={handlePressEnd} onMouseLeave={handlePressCancel} onTouchStart={handlePressStart} onTouchEnd={handlePressEnd} disabled={isSpinning} className={`px-12 py-4 bg-gradient-to-r ${theme.gradient} text-white text-xl font-bold rounded-full shadow-xl transform transition flex items-center justify-center gap-3 select-none ${isLongPressing ? 'scale-95' : 'hover:-translate-y-1 active:scale-95'} ${isSpinning ? 'invisible pointer-events-none' : ''} ${currentPrize.drawn ? 'invisible pointer-events-none' : 'hover:opacity-90'}`}>立即抽獎</button>
                                </div>
                                <div className="flex gap-4 items-center justify-center">
                                    <button onClick={handlePrevPrize} disabled={isSpinning} className={`px-6 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg transition-all bg-black/20 hover:bg-black/40 text-white backdrop-blur-sm border border-white/20 text-sm ${isSpinning ? 'invisible pointer-events-none' : ''} ${currentPrizeIndex <= 0 ? 'invisible pointer-events-none' : ''}`}><ChevronLeft className="w-4 h-4" /> 上一個獎項</button>
                                    <button onClick={handleNextPrize} disabled={isSpinning} className={`px-8 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg transition-all ${currentPrize.drawn ? `bg-gradient-to-r ${theme.gradient} text-white text-xl hover:scale-105 animate-bounce-in` : "bg-black/20 hover:bg-black/40 text-white backdrop-blur-sm border border-white/20 text-sm"} ${isSpinning ? 'invisible pointer-events-none' : ''} ${currentPrizeIndex >= prizes.length - 1 ? 'invisible pointer-events-none' : ''}`}>下一個獎項 <ChevronRight className={currentPrize.drawn ? "w-6 h-6" : "w-4 h-4"} /></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                {isLongPressing && (
                    <div className={`effect-charge-overlay ${!['countdown','toystory','toystory_buzz','implode'].includes(charge.type) ? (CHARGE_EFFECTS[charge.type]?.className || 'effect-flash') : ''} ${charge.type === 'countdown' ? 'effect-countdown' : ''} ${charge.type === 'toystory' ? 'effect-toystory' : ''} ${charge.type === 'toystory_buzz' ? 'effect-buzz' : ''} ${charge.type === 'implode' ? 'effect-implode' : ''}`} style={{ '--charge-scale': 1.0 + (charge.intensity / 100) * 1.5, top: `${effectPos.y + (charge.y - 50) * 4}px`, left: `${effectPos.x + (charge.x - 50) * 4}px` }}>
                        {charge.type === 'implode' && (<><div className="implode-ring" style={{ width: '100%', height: '100%', animationDelay: '0s', borderColor: '#a855f7' }}></div><div className="implode-ring" style={{ width: '80%', height: '80%', animationDelay: '0.2s', borderColor: '#22c55e' }}></div><div className="implode-ring" style={{ width: '60%', height: '60%', animationDelay: '0.4s', borderColor: '#3b82f6' }}></div><div className="implode-ring" style={{ width: '40%', height: '40%', animationDelay: '0.6s', borderColor: '#ec4899' }}></div></>)}
                        {charge.type === 'toystory' && (<><div className="toy-rainbow-wrapper"><div className="toy-rainbow-rays"></div></div><div className="toy-badge-container"><div className="toy-badge-star"><Star size={80} className="text-red-500" fill="currentColor" /></div></div>{[...Array(8)].map((_, i) => { const toys = ['🚀', '🦖', '🥔', '👽', '🧸', '🐖', '🐶', '📦']; const angle = (i / 8) * Math.PI * 2; const dist = 300; const tx = Math.cos(angle) * dist; const ty = Math.sin(angle) * dist; return (<div key={i} className="toy-particle" style={{ '--tx': `${tx}px`, '--ty': `${ty}px`, animationDelay: `${i * 0.1}s` }}>{toys[i % toys.length]}</div>); })}</>)}
                        {charge.type === 'toystory_buzz' && (<div className="buzz-container"><div className="buzz-flying-group"><div className="buzz-jet-beam"></div><div className="buzz-wings"><div className="buzz-wing-left"><div className="buzz-wing-stripes"></div></div><div className="buzz-wing-right"><div className="buzz-wing-stripes"></div></div></div><div className="buzz-ring-purple"></div><div className="buzz-ring-green"></div><div className="buzz-core"><Star size={50} className="text-red-500 drop-shadow-sm" fill="#ef4444" /></div></div><div className="buzz-aftermath"><div className="buzz-smoke"></div>{[...Array(6)].map((_, i) => { const angle = (i / 6) * Math.PI * 2; const dist = 60 + Math.random() * 40; const tx = Math.cos(angle) * dist; const ty = Math.sin(angle) * dist; return (<div key={i} className="buzz-star" style={{ '--tx': `${tx}px`, '--ty': `${ty}px`, animationDelay: `${3.1 + Math.random() * 0.2}s` }}><Star size={20 + Math.random() * 15} fill="currentColor" /></div>); })}</div></div>)}
                    </div>
                )}

                <SettingsPanel isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} prizes={prizes} setPrizes={setPrizes} currentPrizeId={currentPrizeId} setCurrentPrizeId={setCurrentPrizeId} globalWinnersCount={globalWinners.size} onExportCSV={exportToCSV} onFullReset={handleFullReset} onFactoryReset={handleFactoryReset} onExportBackup={handleExportBackup} onImportBackup={handleImportBackup} settingsTab={settingsTab} setSettingsTab={setSettingsTab} theme={theme} absentWinners={absentWinners} onRestoreAbsent={handleRestoreAbsent} participants={participants} settings={settings} updateSettings={updateSettings} themePresets={themePresets} setThemePresets={setThemePresets} />
                <DataImportModal isOpen={isDataModalOpen} onClose={() => setIsDataModalOpen(false)} participants={participants} setParticipants={setParticipants} setGlobalWinners={setGlobalWinners} generateMockData={generateMockData} globalWinners={globalWinners} theme={theme} absentWinners={absentWinners} soundConfig={settings.sound} importHistory={importHistory} setImportHistory={setImportHistory} />
                <ResultModal isOpen={showResultModal} onClose={() => setShowResultModal(false)} currentPrize={currentPrize} currentRoundWinners={currentRoundWinners} theme={theme} allPrizes={prizes} onReplaceWinner={handleBatchAbsence} openConfirm={openConfirm} boxThemeColor={boxThemeColor} soundConfig={settings.sound} />
                <BackupConfirmModal pendingBackup={pendingBackup} setPendingBackup={setPendingBackup} confirmRestoreBackup={confirmRestoreBackup} />
                <ConfirmModal isOpen={confirmModal.isOpen} title={confirmModal.title} message={confirmModal.message} onConfirm={confirmModal.onConfirm} onCancel={() => setConfirmModal(prev => ({ ...prev, isOpen: false }))} soundConfig={settings.sound} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
