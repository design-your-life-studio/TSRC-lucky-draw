<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw Pro</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    
    <!-- 引入 Google Fonts (Press Start 2P) 用於像素風 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Dela+Gothic+One&family=Bungee&display=swap" rel="stylesheet">
    
    <style>
        /* 避免 Google Sites iframe 滾動條問題 */
        body { margin: 0; padding: 0; overflow: hidden; }
        /* 強制隱藏 root 的滾動條，確保畫面固定 */
        #root { height: 100vh; width: 100vw; overflow: hidden; }

        /* --- 自定義動畫 Keyframes --- */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        
        /* 滾動條樣式 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); border-radius: 4px; }
        
        .bg-custom { background-size: cover; background-position: center; }

        /* 背景粒子動畫 */
        @keyframes gold-scatter {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotate(0deg); 
                opacity: 0; 
            }
            10% { 
                opacity: 1; 
                transform: translate(calc(var(--tx) * 0.1 - 50%), calc(var(--ty) * 0.1 - 50%)) scale(1) rotate(45deg); 
                filter: brightness(150%) drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            }
            100% { 
                transform: translate(calc(var(--tx) - 50%), calc(var(--ty) - 50%)) scale(0) rotate(180deg); 
                opacity: 0; 
            }
        }

        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .bg-aurora { background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fbc2eb, #e0c3fc); background-size: 400% 400%; animation: aurora 15s ease infinite; }
        
        /* 童趣樂園 (玩具漂浮) 動畫 */
        @keyframes toy-float-up {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-70vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        /* Modal 動畫 */
        @keyframes scale-in {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in { animation: scale-in 0.2s ease-out forwards; }

        @keyframes slide-in-right {
            0% { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out forwards; }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }

        /* 背景特效動畫 */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 玩具總動員背景 */
        .bg-toystory {
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 100%);
            background-size: cover;
        }

        @keyframes cloud-drift {
            from { transform: translateX(-150px); }
            to { transform: translateX(100vw); }
        }

        /* ----------------------------------------------------------- */
        /* --- 蓄力特效動畫定義區 (Charge Effects) --- */
        /* ----------------------------------------------------------- */

        /* 1. 預設：閃光脈衝 (Flash) */
        @keyframes charge-flash-core {
            0% { opacity: 0; transform: scale(0.5); filter: brightness(1); }
            50% { opacity: 1; transform: scale(var(--charge-scale, 1.2)); filter: brightness(1.5) drop-shadow(0 0 30px gold); }
            100% { opacity: 0; transform: scale(var(--charge-scale, 1.5)); filter: brightness(2); }
        }
        @keyframes charge-flash-particles-spin {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.4) rotate(180deg); opacity: 0; }
        }

        /* 2. 霓虹聚光 (Implode) */
        @keyframes charge-implode-anim {
            0% { 
                transform: scale(2.5); 
                opacity: 0; 
                border-width: 4px; 
            }
            30% { opacity: 1; }
            100% { 
                transform: scale(0); 
                opacity: 0; 
                border-width: 20px; 
            }
        }

        /* 3. 玩具總動員 (Toy Story) */
        @keyframes toy-badge-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        @keyframes toy-pop-out {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translate(calc(var(--tx) * 0.3), calc(var(--ty) * 0.3)) scale(1.2) rotate(72deg); }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(360deg); opacity: 0; }
        }
        
        @keyframes toy-rainbow-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes toy-rainbow-appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .toy-rainbow-wrapper {
            position: absolute;
            inset: -200px;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: toy-rainbow-appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 3s;
            pointer-events: none;
        }

        .toy-rainbow-rays {
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(
                from 0deg,
                #ef4444 0deg 15deg, #f97316 15deg 30deg, #facc15 30deg 45deg,
                #22c55e 45deg 60deg, #3b82f6 60deg 75deg, #a855f7 75deg 90deg, #ef4444 90deg 105deg
            );
            mask-image: radial-gradient(circle, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%);
            animation: toy-rainbow-spin 10s linear infinite;
            filter: brightness(1.2);
        }
        
        /* 4. 巴斯光年 (Buzz Lightyear) */
        @keyframes buzz-ring-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes buzz-wings-deploy {
            0% { width: 40px; opacity: 0; }
            60% { width: 320px; opacity: 1; }
            80% { width: 280px; }
            100% { width: 300px; }
        }
        @keyframes buzz-fly-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            10% { transform: translateY(20px) scale(0.95); }
            20% { transform: translateY(0) scale(1.1); }
            100% { transform: translateY(-150vh) scale(0.5); opacity: 0; }
        }
        @keyframes buzz-jet-flow {
            0% { height: 0; opacity: 0; }
            10% { height: 100px; opacity: 1; }
            100% { height: 600px; opacity: 0; }
        }
        @keyframes buzz-smoke-puff {
            0% { transform: scale(0.2); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; filter: blur(10px); }
        }
        @keyframes buzz-star-flash {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1) rotate(45deg); }
            100% { transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) * 1.5)) scale(0) rotate(90deg); opacity: 0; }
        }

        .effect-buzz {
            mix-blend-mode: normal !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(75, 0, 130, 0.2) 0%, transparent 60%); 
        }

        .buzz-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .buzz-flying-group {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: buzz-fly-up 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards 3s;
        }

        .buzz-jet-beam {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 0;
            background: linear-gradient(to bottom, #fff, #22d3ee, #e879f9, #facc15, transparent);
            z-index: 1;
            border-radius: 0 0 20px 20px;
            filter: blur(5px);
            animation: buzz-jet-flow 0.8s ease-out forwards 3s;
        }

        .buzz-ring-purple {
            position: absolute;
            inset: 15px;
            border: 8px solid #9333ea;
            border-top-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: buzz-ring-rotate 3s linear infinite;
            filter: drop-shadow(0 0 5px rgba(147, 51, 234, 0.8));
            z-index: 15;
        }
        
        .buzz-ring-green {
            position: absolute;
            inset: 40px;
            border: 8px solid #4ade80;
            border-left-color: transparent;
            border-right-color: transparent;
            border-radius: 50%;
            animation: buzz-ring-rotate 2s linear infinite reverse;
            filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.8));
            z-index: 15;
        }

        .buzz-core {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ffffff 40%, #d1d5db 100%);
            border: 5px solid #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .buzz-wings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 80px;
            width: 300px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            animation: buzz-wings-deploy 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .buzz-wing-left, .buzz-wing-right {
            width: 42%;
            height: 100%;
            background: linear-gradient(to bottom, #9333ea, #7e22ce);
            border: 3px solid #e5e7eb;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .buzz-wing-left { border-radius: 20px 0 0 20px; border-right: none; }
        .buzz-wing-right { border-radius: 0 20px 20px 0; border-left: none; }
        
        .buzz-wing-stripes {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            height: 25px;
            background: repeating-linear-gradient(90deg, #ef4444, #ef4444 15px, #ffffff 15px, #ffffff 30px);
        }

        .buzz-aftermath {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            pointer-events: none;
        }

        .buzz-smoke {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #a855f7 0%, #d8b4fe 40%, transparent 80%);
            opacity: 0;
            animation: buzz-smoke-puff 1.2s ease-out forwards 3.1s;
        }

        .buzz-star {
            position: absolute;
            color: #facc15;
            opacity: 0;
            animation: buzz-star-flash 1s ease-out forwards;
        }

        /* 特效通用定位容器 */
        .effect-charge-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            margin-top: -500px;
            margin-left: -500px;
            z-index: 100;
            pointer-events: none;
            mix-blend-mode: screen; 
        }

        .effect-flash {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 223, 0, 0.6) 30%, rgba(255, 140, 0, 0.2) 60%, transparent 70%);
            animation: charge-flash-core 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .effect-flash::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px dashed rgba(255, 255, 255, 0.5); transform: scale(0.9); animation: charge-flash-particles-spin 2s linear infinite;
        }
        .effect-flash::after {
            content: ''; position: absolute; inset: -10%; border-radius: 50%; background-image: radial-gradient(circle, #fff 2px, transparent 3px); background-size: 50px 50px; opacity: 0.6; animation: charge-flash-particles-spin 2s linear infinite reverse;
        }

        .effect-implode {
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .implode-ring {
            position: absolute;
            inset: 0;
            margin: auto;
            border-radius: 50%;
            border-style: solid;
            box-shadow: 0 0 30px currentColor, inset 0 0 20px currentColor;
            opacity: 0;
            animation: charge-implode-anim 1.2s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
            mix-blend-mode: screen;
        }

        .effect-toystory {
            mix-blend-mode: normal !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(135,206,235,0.3) 0%, transparent 60%);
        }
        .toy-badge-container {
            position: relative;
            width: 140px;
            height: 140px;
            background: #FACC15;
            border: 12px solid #3B82F6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.3);
            animation: toy-badge-bounce 0.6s ease-in-out infinite;
            z-index: 20;
        }
        .toy-badge-star {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        
        .toy-particle {
            position: absolute;
            font-size: 70px;
            z-index: 10;
            animation: toy-pop-out 1s ease-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* 隱形觸發區域 */
        .sidebar-trigger-zone {
            position: fixed; top: 0; left: 0; bottom: 0; width: 20px; z-index: 50;
        }
        .settings-trigger-zone {
            position: fixed; top: 0; right: 0; bottom: 0; width: 20px; z-index: 45;
        }


        /* --- 矮視窗(橫向、高度不足)：改成左右版面。左欄＝標題＋按鈕，右欄＝抽獎框 --- */
        @media (max-height: 520px) and (min-aspect-ratio: 5/4) {
            html.ld-narrow .ld-main { display: grid !important; grid-template-columns: minmax(0, 36%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr); column-gap: 1rem; row-gap: clamp(.5rem, 3.2vh, 1.1rem); height: 100%; min-height: 0; padding: .5rem .75rem .5rem 3.25rem !important; align-items: center; overflow: hidden; }
            html.ld-narrow .ld-content { display: contents !important; }
            html.ld-narrow .ld-title { position: static !important; grid-column: 1; grid-row: 2; margin: 0 !important; padding: 0 !important; text-align: center; align-self: end; }
            html.ld-narrow .ld-title > div:first-child { position: static !important; margin-bottom: clamp(.35rem, 2.4vh, .8rem); display: flex; justify-content: center; }
            html.ld-narrow .ld-title h1 { font-size: clamp(1.4rem, min(9vh, 3.3vw), 3rem) !important; white-space: normal !important; line-height: 1.3 !important; }
            html.ld-narrow .ld-title p { font-size: clamp(1rem, min(5.2vh, 1.9vw), 1.7rem) !important; margin-top: clamp(.4rem, 2.6vh, .9rem) !important; gap: .35rem !important; }
            html.ld-narrow .ld-title p .text-3xl { font-size: clamp(1.3rem, min(7vh, 2.6vw), 2.4rem) !important; }
            html.ld-narrow .ld-title > div:first-child span { font-size: clamp(.8rem, 3.6vh, 1.1rem) !important; }
            html.ld-narrow .ld-boxwrap { grid-column: 2; grid-row: 1 / -1; align-self: stretch; height: auto; min-height: 0; max-height: 100%; display: flex; flex-direction: column; border-width: 6px !important; border-radius: 1.25rem !important; }
            html.ld-narrow .ld-boxinner { flex: 1 1 0 !important; height: auto !important; min-height: 0 !important; padding: .5rem !important; }
            html.ld-narrow .ld-boxinner > [class~="-m-8"] { margin: -.5rem !important; width: calc(100% + 1rem) !important; height: calc(100% + 1rem) !important; }
            html.ld-narrow .ld-prizewrap { height: 100%; margin: 0 !important; }
            html.ld-narrow .ld-prizebtn { height: 82%; max-height: 82%; padding: .4rem !important; display: flex; align-items: center; justify-content: center; border-radius: 1.25rem !important; }
            html.ld-narrow .ld-prizeimg { height: 100% !important; max-height: 100%; max-width: 100% !important; }
            html.ld-narrow .ld-start { height: 74% !important; width: auto !important; aspect-ratio: 1 / 1; margin: 0 auto !important; }
            html.ld-narrow .ld-start span { font-size: clamp(1rem, 7vh, 2.6rem) !important; }
            html.ld-narrow .ld-actions { grid-column: 1; grid-row: 3; align-self: start; flex-direction: row !important; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5em !important; font-size: clamp(.5rem, min(calc(1.18vw - .06rem), 4.6vh), 1.15rem); }
            html.ld-narrow .ld-actions .invisible { display: none !important; }
            html.ld-narrow .ld-nav { display: contents !important; }
            html.ld-narrow .ld-prev { order: 1; }
            html.ld-narrow .ld-drawwrap { order: 2; width: auto !important; height: auto !important; }
            html.ld-narrow .ld-next { order: 3; }
            html.ld-narrow .ld-actions button { white-space: nowrap; }
            html.ld-narrow .ld-actions button { padding: .75em 1.5em !important; font-size: .9em !important; gap: .5em !important; line-height: 1.25 !important; }
            html.ld-narrow .ld-actions button svg { width: 1em !important; height: 1em !important; }
            html.ld-narrow .ld-actions .ld-drawwrap button { padding: .6em 1.8em !important; font-size: 1.3em !important; }
            html.ld-narrow .ld-boxinner .mb-6, html.ld-narrow .ld-boxinner .mb-4 { margin-bottom: 0 !important; }
            html.ld-narrow .etch-gold-label { display: none !important; }
            html.ld-narrow .etch-frame { padding: 10px 14px 6px !important; height: 92% !important; }
            html.ld-narrow .etch-knob { width: 26px !important; height: 26px !important; }
            html.ld-narrow .slot-title { display: none !important; }
            html.ld-narrow .slot-window { height: 72% !important; }
            html.ld-narrow .decode-hint { display: none !important; }
            html.ld-narrow .decode-bar { bottom: .5rem !important; transform: scale(.7); }
        }
        @media (max-height: 520px) and (min-aspect-ratio: 5/4) and (max-width: 1000px) {
            html.ld-narrow .ld-main { grid-template-columns: minmax(0, 42%) minmax(0, 1fr) !important; }
            html.ld-narrow .ld-actions { flex-wrap: nowrap !important; gap: .35em !important; font-size: clamp(.5rem, min(calc(1.36vw - .07rem), 4.4vh), 1rem) !important; }
            html.ld-narrow .ld-actions button { padding: .7em 1em !important; }
        }
        @media (max-height: 260px) and (min-aspect-ratio: 5/4) {
            html.ld-narrow .ld-main { row-gap: .15rem !important; padding-top: .35rem !important; padding-bottom: .35rem !important; }
            html.ld-narrow .ld-title > div:first-child { margin-bottom: .1rem !important; }
            html.ld-narrow .ld-title > div:first-child span { padding: .05rem .7rem !important; font-size: .8rem !important; line-height: 1.3 !important; }
            html.ld-narrow .ld-title h1 { font-size: 1.5rem !important; }
            html.ld-narrow .ld-title p { font-size: 1rem !important; }
            html.ld-narrow .ld-title p .text-3xl { font-size: 1.3rem !important; }
            html.ld-narrow .ld-title p { margin-top: .15rem !important; }
            html.ld-narrow .ld-actions { font-size: 1rem !important; }
            html.ld-narrow .ld-actions button { padding: .4em 1.2em !important; }
        }


        /* --- 中矮視窗(高 521~640px、橫向)：維持上下版面，但把抽獎框與間距壓縮，確保按鈕不被切掉 --- */
        @media (max-height: 640px) and (min-height: 521px) and (min-aspect-ratio: 5/4) {
            .ld-content { gap: .6rem !important; }
            .ld-actions { gap: .4rem !important; }
            .ld-drawwrap { height: 3.25rem !important; }
            .ld-boxinner { height: clamp(13rem, calc(100vh - 19.4rem), 20rem) !important; min-height: 0 !important; }
        }


        /* --- 中獎名單視窗：矮視窗(橫向)改左右版面，左＝標題＋按鈕，右＝卡片區 --- */
        @media (max-height: 520px) and (min-aspect-ratio: 5/4) {
            html.ld-narrow .rm-outer { padding: .4rem !important; }
            html.ld-narrow .rm-modal { max-width: 99vw !important; max-height: none !important; height: calc(100vh - .8rem) !important; padding: 2px !important; border-width: 3px !important; }
            html.ld-narrow .rm-modal > button { top: -.2rem !important; right: -.2rem !important; padding: .3rem !important; }
            html.ld-narrow .rm-modal > button svg { width: 1rem !important; height: 1rem !important; }

        #app-lock input { display: block; width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; font-size: 20px; letter-spacing: 0.3em; text-align: left; color: #111; background: #fff; border: 1px solid #bdbdbd; border-radius: 0; outline: none; user-select: text; -webkit-user-select: text; transition: border-color 0.15s ease; }
        #app-lock input:focus { border-color: #111; }
        #app-lock input:disabled { background: #f4f4f2; }
        #app-lock button { display: block; width: 100%; height: 52px; margin-top: 12px; padding: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.2em; color: #fff; background: #111; border: 1px solid #111; border-radius: 0; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
        #app-lock button:hover:not(:disabled) { background: #ffe200; color: #111; }
        #app-lock button:disabled { background: #8a8a8a; border-color: #8a8a8a; cursor: not-allowed; }
        #app-lock .lock-msg { min-height: 18px; margin-top: 16px; font-size: 13px; line-height: 1.4; color: #c4271c; }
        #app-lock .lock-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity 0.3s ease; }
        #app-lock .lock-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 35%; background: #111; animation: lock-slide 1.1s ease-in-out infinite; }
        #app-lock .lock-box.success .lock-bar { opacity: 1; }
        @keyframes lock-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
        @keyframes lock-shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
        #app-lock .lock-box.shake { animation: lock-shake 0.3s; }

    </style>

    <script>
(function () {
    var ITER = 600000, KEY_STORE = 'luckyDrawKey_v2';
    var lock = document.getElementById('app-lock'), box = document.getElementById('app-lock-form');
    var input = document.getElementById('app-lock-input'), btn = document.getElementById('app-lock-btn'), msg = document.getElementById('app-lock-msg');
    var title = document.getElementById('app-lock-title'), sub = document.getElementById('app-lock-sub'), root = document.getElementById('root');
    var fails = 0, cooling = false, busy = false;

    var payloadB64 = document.getElementById('enc-payload').textContent.trim();
    function b64ToBytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
    function bytesToB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
    var raw = b64ToBytes(payloadB64);
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    var subtle = window.crypto && window.crypto.subtle;
    function showMsg(t) { msg.textContent = t; }

    // 進場：驗證成功 → 面板收合顯示「正在進入」→ 等抽獎畫面真的畫出來 → 柔和淡出遮罩、畫面淡入
    function enterSuccessView(first) {
        title.textContent = first ? '驗證成功' : '載入中';
        sub.textContent = '正在進入抽獎程式';
        showMsg('');
        box.classList.remove('verifying'); box.classList.add('success');
    }
    function leave() {
        root.style.opacity = '1';
        lock.classList.add('leaving');
        setTimeout(function () { lock.hidden = true; root.style.transition = ''; root.style.opacity = ''; }, 950);
    }
    function waitForApp(done) {
        var finished = false;
        function fin() { if (finished) return; finished = true; try { mo.disconnect(); } catch (e) {} setTimeout(function () { requestAnimationFrame(done); }, 350); }
        var mo = new MutationObserver(function () { if (root.childElementCount > 0) fin(); });
        mo.observe(root, { childList: true });
        if (root.childElementCount > 0) fin();
        setTimeout(fin, 25000);   // 保底：最久等 25 秒
    }
    function run(code, first) {
        try {
            enterSuccessView(first);
            var out = window.Babel.transform(code, { presets: ['react'], sourceType: 'module' }).code;
            root.style.opacity = '0'; root.style.transition = 'opacity 0.9s ease';
            var s = document.createElement('script');
            s.type = 'module'; s.textContent = out;
            document.body.appendChild(s);
            waitForApp(leave);
        } catch (err) {
            root.style.opacity = ''; root.style.transition = '';
            box.classList.remove('success', 'verifying'); busy = false; btn.disabled = false;
            title.textContent = '請輸入驗證碼'; sub.textContent = '此頁面僅限授權人員使用';
            showMsg('程式載入失敗，請確認網路連線後重新整理頁面');
            try { console.error(err); } catch (e) {}
        }
    }
    function decryptWith(key) {
        return subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (buf) { return new TextDecoder().decode(buf); });
    }
    function deriveKey(pw) {
        return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
            return subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        });
    }

    if (!subtle) { showMsg('此瀏覽器環境不支援加密驗證，請改用 https 網址開啟（或更新瀏覽器）'); btn.disabled = true; input.disabled = true; return; }

    // 同一分頁已驗證過：直接顯示「載入中」並解密，不再要求輸入
    var saved = null;
    try { saved = sessionStorage.getItem(KEY_STORE); } catch (e) {}
    if (saved) {
        enterSuccessView(false);
        subtle.importKey('raw', b64ToBytes(saved), 'AES-GCM', false, ['decrypt'])
            .then(decryptWith).then(function (code) { run(code, false); })
            .catch(function () {
                try { sessionStorage.removeItem(KEY_STORE); } catch (e) {}
                box.classList.remove('success'); title.textContent = '請輸入驗證碼'; sub.textContent = '此頁面僅限授權人員使用';
                setTimeout(function () { input.focus(); }, 50);
            });
    } else {
        setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);
    }

    function setVerifying(on) { busy = on; btn.disabled = on; input.disabled = on; box.classList.toggle('verifying', on); btn.firstChild.textContent = on ? '驗證中…' : '進入'; }
    function submitPw() {
        if (cooling || busy || !input.value) return;
        setVerifying(true); showMsg('');
        deriveKey(input.value).then(function (key) {
            return decryptWith(key).then(function (code) {
                try { return subtle.exportKey('raw', key).then(function (k) { try { sessionStorage.setItem(KEY_STORE, bytesToB64(new Uint8Array(k))); } catch (e) {} return code; }); } catch (e) { return code; }
            });
        }).then(function (code) { setVerifying(false); run(code, true); }).catch(function (err) {
            setVerifying(false);
            if (err && err.name && err.name !== 'OperationError') { showMsg('驗證發生錯誤（' + err.name + '），請改用瀏覽器直接開啟網址'); return; }
            fails++; input.value = '';
            box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
            if (fails >= 5) {
                cooling = true; btn.disabled = true; var left = 30; showMsg('錯誤次數過多，請等待 ' + left + ' 秒後再試');
                var t = setInterval(function () {
                    left--;
                    if (left <= 0) { clearInterval(t); cooling = false; btn.disabled = false; fails = 0; showMsg(''); input.focus(); }
                    else showMsg('錯誤次數過多，請等待 ' + left + ' 秒後再試');
                }, 1000);
            } else { showMsg('驗證碼錯誤，請再試一次'); input.focus(); }
        });
    }
    btn.addEventListener('click', submitPw);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitPw(); } });
})();

    </script>
</body>
